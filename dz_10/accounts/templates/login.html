{% load i18n %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт</title>
    <style>
        /* Базовые стили для центрирования формы на экране */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Белая карточка формы */
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 360px;
        }

        .login-card h3 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            color: #1f2937;
            font-size: 24px;
        }

        /* Контейнеры для полей */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
        }

        /* Стилизация инпутов */
        .form-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Красивая синяя кнопка */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        /* Стили для ошибок */
        .error-block {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h3>{% translate 'Sign in' %}</h3>

        <!-- Ошибки валидации -->
        {% if form.errors %}
            <div class="error-block">
                {% translate 'Incorrect email or password' %}
            </div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}

            <!-- Поле Email -->
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">{% translate 'Username' %}</label>
                <input
                       name="{{ form.username.name }}"
                       id="{{ form.username.id_for_label }}"
                       class="form-input"
                       placeholder="{% translate 'Username' %}"
                       value="{{ form.username.value|default:'' }}">
            </div>

            <!-- Поле Пароль -->
            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">{% translate 'Password' %}</label>
                <input type="password"
                       name="{{ form.password.name }}"
                       id="{{ form.password.id_for_label }}"
                       class="form-input"
                       placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">{% translate 'Submit' %}</button>
        </form>
    </div>

</body>
</html>
