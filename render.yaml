envVarGroups:
  - name: bookshop-runtime
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: BookShop.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: localhost
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: CELERY_TASK_EAGER_PROPAGATES
        value: "False"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

services:
  - type: web
    name: bookshop-web
    runtime: image
    plan: free
    region: frankfurt
    image:
      url: ghcr.io/termopechka/domashka-hillel:main
      creds:
        fromRegistryCreds:
          name: github-container-registry
    dockerCommand: >-
      /bin/sh -c 'python manage.py migrate --noinput &&
      exec gunicorn BookShop.wsgi:application
      --bind 0.0.0.0:${PORT:-10000}
      --workers 2 --timeout 60
      --access-logfile - --error-logfile -'
    healthCheckPath: /health/
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: bookshop-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: bookshop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bookshop-redis
          property: connectionString
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: keyvalue
    name: bookshop-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: "off"

databases:
  - name: bookshop-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "15"
    databaseName: bookshop
    user: bookshop
    ipAllowList: []
