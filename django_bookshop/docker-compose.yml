x-warehouse-environment: &warehouse-environment
  WAREHOUSE_INTEGRATION_ENABLED: '1'
  WAREHOUSE_BASE_URL: http://api:5000/api/v1
  WAREHOUSE_SERVICE_API_KEY: ${WAREHOUSE_SERVICE_API_KEY:-local-warehouse-key-change-in-production}

services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - bookshop_network
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_store:/data
    env_file:
      - .env
    networks:
      - bookshop_network
    command: sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: gunicorn --config gunicorn.conf.py BookShop.wsgi:application
    volumes:
      - .:/app:z
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    networks:
      - bookshop_network
    environment:
      <<: *warehouse-environment
      RUN_DJANGO_SETUP: '1'
      DJANGO_SETTINGS_MODULE: BookShop.settings.production
    expose:
      - '8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/health/',
          headers={'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: celery -A BookShop worker --loglevel=info --concurrency=2
    volumes:
      - .:/app:z
      - media_volume:/app/media
    env_file:
      - .env
    networks:
      - bookshop_network
    environment:
      <<: *warehouse-environment
      DJANGO_SETTINGS_MODULE: BookShop.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: celery -A BookShop beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - .:/app:z
    env_file:
      - .env
    networks:
      - bookshop_network
    environment:
      DJANGO_SETTINGS_MODULE: BookShop.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build: nginx
    restart: unless-stopped
    ports:
      - '80:80'
    networks:
      - bookshop_network
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  bookshop_network:
    name: bookshop_network
    driver: bridge

volumes:
  postgres_data:
  redis_store:
  static_volume:
  media_volume:
