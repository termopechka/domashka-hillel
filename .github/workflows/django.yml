name: Django CI and deploy

on:
  pull_request:
    paths:
      - "dz_10/**"
      - ".github/workflows/django.yml"
      - "render.yaml"
  push:
    branches:
      - main
    paths:
      - "dz_10/**"
      - ".github/workflows/django.yml"
      - "render.yaml"
  workflow_dispatch:

concurrency:
  group: bookshop-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint and test application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dz_10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dz_10/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt flake8==7.3.0

      - name: Lint with Flake8
        run: flake8 .

      - name: Run tests
        run: pytest -q

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=BookShop.test_settings

      - name: Run production deployment checks
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production
          ALLOWED_HOSTS: localhost
          DATABASE_URL: postgresql://bookshop:bookshop@localhost:5432/bookshop
          REDIS_URL: redis://localhost:6379
          SECURE_SSL_REDIRECT: "False"
        run: python manage.py check --deploy --settings=BookShop.settings.production

  build-and-push:
    name: Build and push Docker image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./dz_10
          file: ./dz_10/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy image to Render
    needs: build-and-push
    if: vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Trigger Render image deploys
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
          RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
        run: |
          set -eu

          image="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

          trigger_deploy() {
            service_name="$1"
            deploy_hook="$2"

            if [ -z "${deploy_hook}" ]; then
              echo "Missing deploy hook for ${service_name}" >&2
              exit 1
            fi

            echo "Triggering ${service_name} with ${image}"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --get \
              --data-urlencode "imgURL=${image}" \
              "${deploy_hook}"
            echo
          }

          trigger_deploy "bookshop-web" "${RENDER_WEB_DEPLOY_HOOK_URL}"
