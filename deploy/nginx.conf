map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    "" $request_id;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

upstream bookshop {
    server bookshop-web:8000;
    keepalive 16;
}

upstream warehouse {
    server warehouse-api:5000;
    keepalive 16;
}

server_tokens off;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://bookshop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $correlation_id always;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 5m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://warehouse;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $correlation_id always;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
